name: Create and publish a container image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build (e.g. v1.6.6)
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to the Container registry
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@1104d471370f9806843c095c1db02b5a90c5f8b6 # v3.3.1
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}

      - name: Create payload file
        id: create-payload
        env:
          REPO_FULL: ${{ github.repository }}
        run: |
          REPO_NAME="${REPO_FULL##*/}"
          echo "{\"repository\": {\"name\": \"${REPO_NAME}\"}}" > payload.json

      - name: Send GitHub webhook
        if: steps.create-payload.outcome == 'success'
        env:
          WEBHOOK_SERVER: ${{ secrets.WEBHOOK_SERVER }}
          WEBHOOK_SERVER_SECRET: ${{ secrets.WEBHOOK_SERVER_SECRET }}
          EVENT: push
          PAYLOAD_FILE: payload.json
        run: |
          SIG="sha256=$(openssl dgst -sha256 -hmac "$WEBHOOK_SERVER_SECRET" "$PAYLOAD_FILE" | sed 's/^.* //')"
          DELIVERY_ID=$(uuidgen)
          curl -X POST "$WEBHOOK_SERVER" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIG" \
            -H "X-GitHub-Event: $EVENT" \
            -H "X-GitHub-Delivery: $DELIVERY_ID" \
            --data-binary "@$PAYLOAD_FILE"
